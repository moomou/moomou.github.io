<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" role="img" aria-labelledby="title desc">
  <title id="title">mini_sglang runtime architecture</title>
  <desc id="desc">The FastAPI request coroutine and engine thread communicate only through pending_q and a per-request asyncio output queue. Inside Engine._run, the scheduler selects waiting and running requests, reserves and packs metadata, runs Qwen3 with paged KV, samples tokens, and then detokenizes before returning text to the event loop.</desc>

  <defs>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" class="marker-blue"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" class="marker-green"/>
    </marker>
    <marker id="arrow-gray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" class="marker-gray"/>
    </marker>

    <style>
      svg {
        --canvas: #fbfaf7;
        --surface: #ffffff;
        --http: #f7f9fb;
        --engine: #faf8f4;
        --ink: #1c1c1c;
        --muted: #68655f;
        --subtle: #959188;
        --rule: #d9d6cf;
        --rule-strong: #bdb9b0;
        --blue: #1f4e79;
        --blue-bg: #edf4fa;
        --green: #2f6f4e;
        --green-bg: #edf7f1;
        --rust: #c2410c;
        --rust-bg: #fbf0e8;
      }

      @media (prefers-color-scheme: dark) {
        svg {
          --canvas: #101113;
          --surface: #1d1f23;
          --http: #15181c;
          --engine: #181614;
          --ink: #e6e4df;
          --muted: #aaa79f;
          --subtle: #77756f;
          --rule: #34363b;
          --rule-strong: #505158;
          --blue: #8ab4f0;
          --blue-bg: #182536;
          --green: #7ed492;
          --green-bg: #172a20;
          --rust: #e98a4f;
          --rust-bg: #302117;
        }
      }

      text {
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        fill: var(--ink);
        text-rendering: geometricPrecision;
      }

      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      }

      .canvas { fill: var(--canvas); stroke: var(--rule); }
      .http-card { fill: var(--http); stroke: var(--rule); }
      .engine-card { fill: var(--engine); stroke: var(--rule); }
      .queue-in { fill: var(--blue-bg); stroke: var(--blue); }
      .queue-out { fill: var(--green-bg); stroke: var(--green); }
      .step { fill: var(--rust-bg); stroke: var(--rust); }

      .kicker { font-size: 11px; font-weight: 700; letter-spacing: 1.5px; fill: var(--subtle); }
      .title { font-size: 20px; font-weight: 700; letter-spacing: -.25px; }
      .subtitle { font-size: 12.5px; fill: var(--muted); }
      .section { font-size: 14px; font-weight: 650; }
      .body { font-size: 12.5px; fill: var(--muted); }
      .code { font-size: 12px; fill: var(--muted); }
      .queue-title { font-size: 13px; font-weight: 700; }
      .queue-sub { font-size: 9.5px; fill: var(--muted); }
      .step-num { font-size: 11px; font-weight: 700; fill: var(--rust); }
      .step-title { font-size: 11px; font-weight: 700; letter-spacing: .5px; }
      .step-sub { font-size: 10px; fill: var(--muted); }
      .blue { fill: var(--blue); }
      .green { fill: var(--green); }

      .divider { stroke: var(--rule); }
      .boundary { stroke: var(--rule-strong); stroke-dasharray: 4 5; }
      .timeline { stroke: var(--rust); stroke-width: 1.5; }

      .in {
        fill: none;
        stroke: var(--blue);
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
        marker-end: url(#arrow-blue);
      }

      .out {
        fill: none;
        stroke: var(--green);
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
        marker-end: url(#arrow-green);
      }

      .flow {
        fill: none;
        stroke: var(--rule-strong);
        stroke-width: 1.4;
        stroke-linecap: round;
        marker-end: url(#arrow-gray);
      }

      .marker-blue { fill: var(--blue); }
      .marker-green { fill: var(--green); }
      .marker-gray { fill: var(--rule-strong); }
    </style>
  </defs>

  <rect x="1" y="1" width="918" height="438" rx="16" class="canvas"/>

  <!-- Two owners -->
  <rect x="18" y="18" width="300" height="404" rx="13" class="http-card"/>
  <rect x="384" y="18" width="518" height="404" rx="13" class="engine-card"/>
  <line x1="351" y1="30" x2="351" y2="410" class="boundary"/>

  <!-- HTTP coroutine -->
  <text x="42" y="48" class="kicker">HTTP / ASYNCIO</text>
  <text x="42" y="76" class="title">Request coroutine</text>
  <text x="42" y="98" class="subtitle">one coroutine per request</text>

  <line x1="42" y1="119" x2="294" y2="119" class="divider"/>

  <text x="42" y="148" class="mono section">POST /generate</text>
  <text x="42" y="174" class="mono code">ids = tokenizer.encode(prompt)</text>
  <text x="42" y="198" class="mono code">gen = GenRequest(req, out_q, loop)</text>

  <line x1="42" y1="228" x2="294" y2="228" class="divider"/>

  <text x="42" y="280" class="mono section">while True:</text>
  <text x="58" y="306" class="mono code">piece = await out_q.get()</text>
  <text x="58" y="330" class="mono code">if piece is None: break</text>
  <text x="58" y="354" class="mono code">yield SSE(piece)</text>

  <!-- Boundary queues -->
  <rect x="303" y="154" width="96" height="52" rx="10" class="queue-in"/>
  <text x="351" y="176" text-anchor="middle" class="mono queue-title blue">pending_q</text>
  <text x="351" y="193" text-anchor="middle" class="queue-sub">queue.Queue</text>

  <path d="M294 180H303" class="in"/>
  <path d="M399 180H416" class="in"/>

  <rect x="303" y="356" width="96" height="52" rx="10" class="queue-out"/>
  <text x="351" y="378" text-anchor="middle" class="mono queue-title green">out_q</text>
  <text x="351" y="395" text-anchor="middle" class="queue-sub">asyncio.Queue</text>

  <path d="M416 382H399" class="out"/>
  <path d="M303 382H294" class="out"/>

  <!-- Engine loop -->
  <text x="416" y="48" class="kicker">ENGINE THREAD</text>
  <text x="416" y="76" class="mono title">Engine._run()</text>
  <text x="416" y="98" class="subtitle">the only thread that mutates serving state</text>

  <line x1="416" y1="119" x2="878" y2="119" class="divider"/>

  <text x="416" y="148" class="mono section">drain pending_q</text>
  <text x="416" y="174" class="mono code">scheduler.add_request(gen.req)</text>

  <path d="M647 188V211" class="flow"/>

  <!-- Scheduler timeline -->
  <text x="416" y="228" class="mono section">scheduler.step()</text>
  <text x="878" y="228" text-anchor="end" class="subtitle">one model forward</text>

  <line x1="458" y1="267" x2="838" y2="267" class="timeline"/>

  <circle cx="458" cy="267" r="14" class="step"/>
  <text x="458" y="271" text-anchor="middle" class="step-num">1</text>
  <text x="458" y="300" text-anchor="middle" class="step-title">FORM BATCH</text>
  <text x="458" y="316" text-anchor="middle" class="step-sub">active decodes</text>
  <text x="458" y="330" text-anchor="middle" class="step-sub">+ admitted prefills</text>

  <circle cx="585" cy="267" r="14" class="step"/>
  <text x="585" y="271" text-anchor="middle" class="step-num">2</text>
  <text x="585" y="300" text-anchor="middle" class="step-title">BUILD INPUTS</text>
  <text x="585" y="316" text-anchor="middle" class="step-sub">reserve KV blocks</text>
  <text x="585" y="330" text-anchor="middle" class="step-sub">+ create ForwardMeta</text>

  <circle cx="712" cy="267" r="14" class="step"/>
  <text x="712" y="271" text-anchor="middle" class="step-num">3</text>
  <text x="712" y="300" text-anchor="middle" class="step-title">FORWARD</text>
  <text x="712" y="318" text-anchor="middle" class="step-sub">Qwen3 + paged KV</text>

  <circle cx="838" cy="267" r="14" class="step"/>
  <text x="838" y="271" text-anchor="middle" class="step-num">4</text>
  <text x="838" y="300" text-anchor="middle" class="step-title">SAMPLE</text>
  <text x="838" y="318" text-anchor="middle" class="step-sub">one token / request</text>

  <line x1="416" y1="343" x2="878" y2="343" class="divider"/>

  <text x="416" y="372" class="mono section">piece = detok.push(token)</text>
  <text x="416" y="398" class="mono code">loop.call_soon_threadsafe(out_q.put_nowait, piece)</text>
</svg>
